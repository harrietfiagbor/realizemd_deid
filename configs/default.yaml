# RealizeMD De-identification Pipeline — Default Config
# All hyperparameters in one place. Override per experiment.

pipeline:
  target_size: 512          # resize all images to this before processing
  device: cuda              # cuda | cpu

preprocessing:
  clahe_clip: 2.0
  clahe_tile: [8, 8]
  fov_inset: 5              # pixels to inset from detected FOV edge

segmentation:
  model: attention_unet     # attention_unet (Model A)
  weights: models/attention_unet/retina_attentionUnet_150epochs.hdf5
  input_channels: 1         # green channel only
  threshold: 0.5

vessel_mask:
  dilation_kernel: 20       # px — supervisor target: 8-12% coverage

pathology:
  optic_disc_threshold: 220
  optic_disc_dilation: 50
  hard_exudate:
    percentile: 97
    min_brightness: 180
    min_area: 10
  haemorrhage:
    green_threshold: 80
    min_area: 30
    max_area: 2000
    min_circularity: 0.4
    max_eccentricity: 0.85
  microaneurysm:
    blackhat_kernel: 21
    threshold: 20
    min_area: 8
    max_area: 50
    min_circularity: 0.45
    max_eccentricity: 0.80
  lesion_dilation_kernel: 3

inpainting:
  model: sd_controlnet       # sd_controlnet | lama
  device: cuda

  # Path C — SD + ControlNet
  sd_model: runwayml/stable-diffusion-inpainting
  controlnet_model: lllyasviel/sd-controlnet-scribble
  num_inference_steps: 50
  guidance_scale: 7.5
  strength: 1.0
  controlnet_conditioning_scale: 0.6   # sweep: 0.4 / 0.5 / 0.6 / 0.7

  prompt: >
    high quality color fundus photograph, retinal blood vessels,
    dark red burgundy vessels on red-orange retinal background,
    sharp focus, medical photography, ophthalmology, no text, no watermark
  negative_prompt: >
    blurry, low quality, abstract, painting, illustration,
    blue tint, gray, smooth, blob, chalk, white lines, ink strokes,
    high contrast lines, unnatural colors, watermark, text, signature

  # Vessel pattern deformation (Option B)
  vessel_pattern:
    elastic_alpha: 200
    elastic_sigma: 20
    rotate_min: 15
    rotate_max: 60
    flip_prob: 0.3

  # LoRA fine-tune weights (optional)
  lora_weights: /workspace/fundus_lora_v1/pytorch_lora_weights.safetensors
  lora_scale: 0.7   # 0.5-0.8; lower = less retinal style, higher = more

  # LaMa fallback (kept for reference)
  lama_weights: models/big-lama/

eval:
  reid:
    model: retfound           # RETFound ViT-Large as embedder
    weights: models/RETFound_mae_natureCFP.pth
    target_rank1_rate: 0.004  # ≤ 2× random at N=500
    target_same_patient_auc: 0.55
  utility:
    dr_classifier: convnext   # convnext | retfound_finetuned
    preservation_ratio_pass: 0.95
    preservation_ratio_acceptable: 0.90
  realism:
    fid_pass: 30
    ssim_min: 0.65
    ssim_max: 0.85
    lpips_min: 0.15
    lpips_max: 0.35

adversarial:
  enabled: true               # set true to activate Option C privacy pass
  epsilon: 0.03               # L-inf perturbation budget (~12/255)
  step_size: 0.002            # gradient step size per iteration
  n_steps: 150                # optimisation iterations per image
  lesion_suppression: true    # suppress perturbation on lesion regions
  lesion_suppress_weight: 0.1 # residual perturbation allowed on lesions (0=none)
  loss_weights:
    retfound: 1.0
    flair: 1.0
  encoders:
    retfound:
      enabled: true
      weights: models/RETFound_mae_natureCFP.pth
      dir: /workspace/RETFound
    flair:
      enabled: true           # weights auto-downloaded via HF cache
      weights: ~                  # not needed — loaded via from_pretrained
      dir: ~                      # not needed
